[project]
name = "drf-kr"
version = "0.1.0"
description = ""
authors = [
    {name = "Konstantin Voronin",email = "heavensmiting@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv (>=1.1.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "django (>=5.2.7,<6.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "ipython (>=9.6.0,<10.0.0)",
    "django-countries (>=7.6.1,<8.0.0)",
    "redis (>=7.0.0,<8.0.0)",
    "django-filter (>=25.2,<26.0)",
    "celery (>=5.5.3,<6.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "eventlet (>=0.40.3,<0.41.0)",
    "drf-spectacular (>=0.28.0,<0.29.0)",
    "coverage (>=7.11.0,<8.0.0)",
    "django-phonenumber-field (>=8.3.0,<9.0.0)",
    "phonenumbers (>=9.0.17,<10.0.0)",
    "cron-descriptor (>=2.0.6,<3.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^7.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = '^(venv|tests)(/|$)'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''
[tool.isort]
# максимальная длина строки
line_length = 119

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src --cov-report=term-missing"